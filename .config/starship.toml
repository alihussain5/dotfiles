format = "$directory$git_branch$git_commit$git_state$git_status$character"
right_format = "$cmd_duration$direnv$python$nix_shell${custom.aws_sso}"
add_newline = false

[directory]
format = "[$path]($style) "
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style) "
style = "cyan"
repo_root_style = "bold bright-blue"
read_only = ""
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[$branch]($style) "
style = "green"
truncation_length = 32
truncation_symbol = "…"

[git_commit]
format = "[@$hash]($style) "
style = "green"
commit_hash_length = 8
only_detached = true

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "red"

[git_status]
format = "$all_status$ahead_behind"
conflicted = "[~${count} ](red)"
stashed = ""
deleted = "[!${count} ](yellow)"
renamed = "[»${count} ](yellow)"
modified = "[!${count} ](yellow)"
staged = "[+${count} ](yellow)"
untracked = "[?${count} ](blue)"
ahead = "[⇡${count} ](green)"
behind = "[⇣${count} ](green)"
diverged = "[⇣${behind_count}⇡${ahead_count} ](green)"
up_to_date = ""

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
min_time = 3000
show_milliseconds = false

[direnv]
format = "[$symbol]($style) "
symbol = "▼"
style = "yellow"
disabled = false
detect_files = []
detect_folders = []
detect_env_vars = ["DIRENV_FILE"]

[python]
format = "[$symbol$virtualenv]($style) "
symbol = " "
style = "cyan"
detect_extensions = []
detect_files = []
detect_folders = []
detect_env_vars = ["VIRTUAL_ENV"]
generic_venv_names = ["venv", ".venv"]

[nix_shell]
format = "[$symbol$state]($style)"
symbol = " "
style = "blue"

[custom.aws_sso]
command = "printf '󰸏 AWS ✓'"
when = '''test -d "$HOME/.aws/sso/cache" && jq -e 'select((.accessToken // "") != "" and ((.expiresAt | sub("UTC$"; "Z") | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) > now)) | true' "$HOME"/.aws/sso/cache/*.json 2>/dev/null | grep -q true'''
format = "[$output]($style)"
style = "green"
shell = ["sh"]

[character]
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
